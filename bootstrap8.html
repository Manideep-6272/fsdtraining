<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>
<body>
    <div class="container mt-5 p-4" style="width: 400px; border:1px solid black; border-radius:15px;">
        <h3 class="text-center mb-4">Registration form</h3>
        <form action="">
            <label for="username" class="form-label mb-2">Enter username</label>
            <input type="text" class="form-control mb-2">
            <label for="email" class="form-label mb-2">Enter email id</label>
            <input type="email" class="form-control mb-2">
            <label for="password" class="form-label mb-2">Set password</label>
            <input type="password" class="form-control mb-2">
            <button class="btn btn-primary">Submit</button>
        </form>
    </div>
</body>
</html>
