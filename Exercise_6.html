<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 200px;
            width: 200px;
            font-size: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
        }

        .container:hover{
            transition: all 2s;
            transition-property: "height width font-size";
            height: 250px;
            width: 250px;
            font-size: 35px;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Card</p>
    </div>
</body>
</html>
