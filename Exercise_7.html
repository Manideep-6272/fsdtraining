<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .navbar{
            display: flex;
            flex-direction: row;
            background-color: bisque;
            height: 100px;
            font-size: 15px;
            align-items: center;
            justify-content: space-around;
        }
        .navbar a:hover{
            transition:all 0.5s;
            transition-property: "color font-size text-decoration";
            color:red;
            font-size: 20px;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a>Home</a>
        <a>About</a>
        <a>Contact</a>
        <a>Services</a>
    </div>
</body>
</html>
