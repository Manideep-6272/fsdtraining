<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cvr College of Engineering</title>
    <style>
        .navbar{
            padding: 20px;
            background-color: darkblue;
            display: flex;
            color: white;
            align-items: center;
            justify-content: space-between;
            flex-direction: row;
        }
        .nav-list{
            width: 30%;
            font-size: 30px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        @media (max-width : 768px){
            .navbar{
                display: flex;
                flex-direction: column;
            }
            .nav-list{
                display: flex;
                flex-direction: column;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <img src="./clglogo.jpg" alt="college logo">
        </div>
        <div class="nav-list">
            <a>Home</a>
            <a>About</a>
            <a>Services</a>
            <a>Contact</a>
        </div>
    </div>
</body>
</html>
