<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile card</title>
    <style>
        .container{
            display:flex;
            flex-direction: row;
            gap: 20px;
            border: 2px solid black;
            align-items: center;
            width: 420px;
            height:auto;
            justify-content: center;
            margin: 20px auto;
            background-color: #c5c5c5;
            gap: 25px;
        }

        .profile{
            width: 150px;
            height: 150px;
            border-radius: 50%;
            magin: 10px;
            border: 2px solid rgb(163, 80, 80);
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 10px;
                width: 100%;
                background-color: #a88383;
            }
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Student Profile Card</h1>
    <div class="container">
        <div class="image">
            <img src="./profile.jpg" alt="profile photo" class="profile">
        </div>
        <div class="details">
            <h2>Name: Manideep</h2>
            <p>Branch: Data Science</p>
            <p>Email: manideep@gmail.com</p>
        </div>
    </div>
</body>
</html>
