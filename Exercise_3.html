<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Gallery</title>
    <style>
        .container{
            display:grid;
            grid-template-columns: 25% 25% 25% 25%;
            justify-items: center;
            align-items: center;
            gap: 10px;
        }
        .container img{
            width: 30%;
            border-radius: 50%;
            border: 2px solid #000000;
            height: auto;
        }
        @media (max-width:767px){
            .container{
                grid-template-columns: 100%;
            }
            .container img{
                width: 50%;
            }
        }

        @media (min-width:768px) and (max-width:1023px){
            .container{
                grid-template-columns: 50% 50%;
            }
            .container img{
                width: 40%;
            }
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Responsive Gallery</h1>
    <div class="container">
        <img src="./profile.jpg" alt="Image 1">
        <img src="./profile.jpg" alt="Image 2">
        <img src="./profile.jpg" alt="Image 3">
        <img src="./profile.jpg" alt="Image 4">
        <img src="./profile.jpg" alt="Image 5">
        <img src="./profile.jpg" alt="Image 6">
        <img src="./profile.jpg" alt="Image 7">
        <img src="./profile.jpg" alt="Image 8">
    </div>
</body>
</html>
