<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            background-color: blue;
            height: 100px;
            width: 200px;
            color: white;
            font-size: 20px;
        }
        button:hover{
            transition: all 1s;
            scale: 1.1;
            transition-property: "background-color";
           background-color: green;
        }
    </style>
</head>
<body>
    <button>Click me!</button>
</body>
</html>
