<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            height: 200px;
            width: 200px;
        }
        img:hover{
            transition:all 1s;
            transition-property: transform;
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./profile.jpg" alt="profile">
    </div>
</body>
</html>
