<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>
<body>
    <div class="card m-5" style="width: 330px;">
        <div class="card-header text-center bg-warning">
            <h4>Cvr College Of Engineering</h4>
            <p>Hyderabad</p>
        </div>
        <div class="card-body text-center bg-light">
            <div class="card-title fs-5">Student Identity Card</div>
            <img src="./profile.jpg" alt="" class="card-img-top" style="height: 100px; width:100px;">
            <div class="card-title mt-3 bg-warning" style="width: 40%; margin: 0 auto; border-radius: 5px;">23B81A67F0</div>
            <div class="card-title mt-2">Name : Manideep</div>
            <div class="card-title">Branch : Data Science</div>
            <div class="card-title">Section : C</div>
        </div>
    </div>
</body>
</html>
