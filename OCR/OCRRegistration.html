<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div id="successAlert" class="alert alert-success alert-dismissible fade d-none" role="alert">
                <h4 class="alert-heading">✨ Registration Successful!</h4>
                <p class="mb-0">Thank you for registering. Your details have been submitted securely.</p>
                <button type="button" class="btn-close" onclick="closeAlert()" aria-label="Close"></button>
            </div>
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h3 class="mb-0">Student Registration Form</h3>
                </div>
                <div class="card-body p-4">
                    <form id="registrationForm">
                        <div class="mb-3">
                            <label for="studentName" class="form-label fw-bold">Student Name</label>
                            <input type="text" class="form-control" id="studentName" placeholder="Enter your full name" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="studentEmail" class="form-label fw-bold">Email Address</label>
                                <input type="email" class="form-control" id="studentEmail" placeholder="name@example.com" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="mobileNumber" class="form-label fw-bold">Mobile Number</label>
                                <input type="tel" class="form-control" id="mobileNumber" placeholder="Enter 10-digit number" pattern="[0-9]{10}" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold d-block">Gender</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderMale" value="Male" required>
                                <label class="form-check-input-label" for="genderMale">Male</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="Female">
                                <label class="form-check-input-label" for="genderFemale">Female</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="courseSelect" class="form-label fw-bold">Course Selection</label>
                            <select class="form-select" id="courseSelect" required>
                                <option value="" selected disabled>Choose a course...</option>
                                <option value="web-dev">Web Development</option>
                                <option value="python">Python Programming</option>
                                <option value="data-science">Data Science</option>
                                <option value="ai-ml">AI & Machine Learning</option>
                                <option value="java">Java Programming</option>
                                <option value="cloud">Cloud Computing</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="qualification" class="form-label fw-bold">Highest Qualification</label>
                            <input type="text" class="form-control" id="qualification" placeholder="e.g., Bachelor's Degree, High School" required>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label fw-bold">Address</label>
                            <textarea class="form-control" id="address" rows="3" placeholder="Enter your full permanent address" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="resumeUpload" class="form-label fw-bold">Upload Resume</label>
                            <input class="form-control" type="file" id="resumeUpload" accept=".pdf,.doc,.docx" required>
                        </div>
                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                <label class="form-check-label text-muted small" for="termsCheck">
                                    I agree to the terms and conditions and verify that the provided details are accurate.
                                </label>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Submit Registration</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
